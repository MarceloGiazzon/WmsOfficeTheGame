<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>WmsOffice - Movimentacao Livre</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #f5f6f8; color: #1c2333; font-family: "Segoe UI", system-ui, sans-serif; }
    #bar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: #f0f2f5; border-bottom: 1px solid #d3d4d3; font-size: 13px; flex-wrap: wrap; }
    #bar input, #bar select { background: #fff; color: #1c2333; border: 1px solid #c8d0da; border-radius: 4px; padding: 4px 6px; }
    #bar input#base { width: 220px; }
    #bar button { background: #295572; color: #fff; border: 0; font-weight: 600; border-radius: 4px; padding: 5px 12px; cursor: pointer; }
    #status { margin-left: auto; color: #6b7280; }
    main { padding: 14px; max-width: 1200px; margin: 0 auto; }
    section { background: #ffffff; border: 1px solid #d3d4d3; box-shadow: 0 1px 3px rgba(41,85,114,.1); border-radius: 8px; padding: 14px; margin-bottom: 16px; }
    h2 { margin: 0 0 10px 0; font-size: 15px; color: #295572; }
    h3 { margin: 0 0 8px 0; font-size: 13px; color: #3d6a8a; }
    .note { font-size: 11px; opacity: .55; margin-top: -4px; margin-bottom: 10px; }
    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .row label { display: flex; flex-direction: column; font-size: 11px; opacity: .8; gap: 3px; }
    select, input[type=number], input[type=date], input[type=text] {
      background: #fff; color: #1c2333; border: 1px solid #c8d0da; border-radius: 4px; padding: 6px; min-width: 150px;
    }
    input.qty-input { min-width: 90px; }
    button.action { background: #295572; color: #fff; border: 0; font-weight: 600; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
    button.secondary { background: #e4e5e6; color: #1c2333; border: 1px solid #c8d0da; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
    button.suggest { background: #ff8000; color: #fff; border: 0; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
    button.small { padding: 3px 8px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 6px; }
    th, td { text-align: left; padding: 5px 7px; border-bottom: 1px solid #e5e5e5; }
    th { background: #295572; color: #ffffff; font-weight: 600; }
    tbody tr:nth-child(even) { background: #f0f2f5; }
    .item-block { border: 1px solid #d3d4d3; border-radius: 6px; padding: 10px; margin-bottom: 10px; background: #f7f9fb; }
    .item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .sides { display: flex; gap: 12px; flex-wrap: wrap; }
    .side { flex: 1; min-width: 260px; }
    .side h3.origem { color: #e08000; }
    .side h3.destino { color: #2f6fd0; }
    .banner { padding: 4px 10px; border-radius: 4px; font-size: 12px; display: inline-block; }
    .banner.ok { background: #e6f6ea; color: #008000; }
    .banner.pending { background: #fff3da; color: #b35900; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
    .badge.Pendente { background: #d9e6f2; color: #295572; }
    .badge.Concluido { background: #d9f2d9; color: #008000; }
    .badge.Suspenso { background: #fff3da; color: #b35900; }
    .badge.Cancelado { background: #fbe4e4; color: #cc1f1f; }
    #log { background: #f7f9fb; border: 1px solid #d3d4d3; border-radius: 6px; padding: 10px; font-size: 12px;
      max-height: 200px; overflow: auto; white-space: pre-wrap; }
    #log .ok { color: #008000; }
    #log .err { color: #cc1f1f; }
    .hint { font-size: 11px; opacity: .6; }
  </style>
  <link rel="stylesheet" href="shell.css" />
  <script src="shell.js" defer></script>
</head>
<body>
  <div id="bar">
    <label>API <input id="base" value="http://localhost:8100" /></label>
    <label>Token <input id="key" value="" size="16" placeholder="faca login" /></label>
    <label>Entidade
      <select id="entidadeSel"></select>
    </label>
    <label>Movimento Livre pendente
      <select id="movimentoSel"></select>
    </label>
    <button id="reload">Recarregar</button>
    <button id="novoMovimento">Novo Movimento Livre</button>
    <span id="status">idle</span>
  </div>
  <main>
    <section id="headerSection"></section>
    <section id="itensSection"></section>
    <section>
      <h2>Log</h2>
      <div id="log"></div>
    </section>
  </main>

  <script>
    // "Movimentacao Livre" (Movto Livre) -- ported from a real original business doc
    // ("WmsOffice - Basicos - Movto Livre.docx") that had no NPDev equivalent: relocating stock
    // from one bin directly to another, with no Recebimento/Expedicao header at all (unlike
    // centro-trabalho.html, whose type selector is hardcoded Recebimento->Destino-only /
    // Expedicao->Origem-only and has no header record type for this case). The underlying data
    // model already supports it -- MovimentoItemPosicao.papel can be Origem or Destino on the
    // *same* MovimentoItem -- this page is the missing UI, reusing centro-trabalho.html's proven
    // syncOcupacao/Sugerir patterns for both sides of a single item at once.
    const $ = (id) => document.getElementById(id);
    window.addEventListener("DOMContentLoaded", function () { var saved = localStorage.getItem("npdev.shell.token"); var el = document.getElementById("key"); if (saved && el) el.value = saved; });
    const apiBase = () => $('base').value.replace(/\/$/, '');
    const apiKey = () => $('key').value.trim();

    function log(message, ok) {
      const div = document.createElement('div');
      div.className = ok ? 'ok' : 'err';
      div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      $('log').prepend(div);
    }
    async function apiGet(path) {
      const res = await fetch(apiBase() + path, { headers: { 'Authorization': 'Bearer ' + apiKey() } });
      if (!res.ok) throw new Error(path + ' -> HTTP ' + res.status);
      return res.json();
    }
    async function apiSend(method, path, body) {
      const res = await fetch(apiBase() + path, {
        method, headers: { 'Authorization': 'Bearer ' + apiKey(), 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const text = await res.text();
      let parsed = null;
      try { parsed = text ? JSON.parse(text) : null; } catch (e) { /* leave null */ }
      if (!res.ok) {
        const msg = (parsed && (parsed.error || parsed.message)) || text || ('HTTP ' + res.status);
        throw new Error(msg);
      }
      return parsed;
    }
    const list = (v) => Array.isArray(v) ? v : (v && Array.isArray(v.items) ? v.items : (v && Array.isArray(v.content) ? v.content : []));
    const short = (id) => id ? id.slice(0, 8) + '...' : '';

    let cache = { entidades: [], produtos: [], lotes: [], locais: [], itens: [], posicoes: [], ocupacoes: [] };
    let selectedMovimento = null;

    async function loadReferenceData() {
      const [entidades, produtos, lotes, locais] = await Promise.all([
        apiGet('/api/entidades'), apiGet('/api/produtos'), apiGet('/api/lotes'), apiGet('/api/local_armazenagems')
      ]).then(r => r.map(list));
      cache.entidades = entidades; cache.produtos = produtos; cache.lotes = lotes; cache.locais = locais;
      const entSel = $('entidadeSel');
      entSel.innerHTML = '';
      entidades.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.id; opt.textContent = e.nome;
        entSel.appendChild(opt);
      });
    }
    function produtoNome(id) { const p = cache.produtos.find(x => x.id === id); return p ? p.nome : short(id); }
    function loteLabel(id) {
      const l = cache.lotes.find(x => x.id === id);
      return l ? `${produtoNome(l.produtoId)} (val. ${l.dataValidade}, ${l.ocorrencia})` : short(id);
    }
    function localLabel(id) {
      const local = cache.locais.find(x => x.id === id);
      return local ? `Pos ${local.posicao}/And ${local.andar} (${local.situacao})` : short(id);
    }

    async function loadPendentes() {
      $('status').textContent = 'carregando...';
      try {
        await loadReferenceData();
        const movimentos = list(await apiGet('/api/movimentos'));
        const pendentes = movimentos.filter(m => m.tipo === 'MovtoLivre' && m.situacao === 'Pendente');
        const sel = $('movimentoSel');
        sel.innerHTML = '';
        pendentes.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id; opt.textContent = `${short(m.id)} - ${m.dataMovimento}`;
          sel.appendChild(opt);
        });
        $('status').textContent = `${pendentes.length} pendente(s)`;
        if (pendentes.length > 0) {
          await selectMovimento(pendentes[0].id);
        } else {
          selectedMovimento = null; cache.itens = []; cache.posicoes = [];
          renderHeader(); renderItens();
        }
      } catch (e) {
        $('status').textContent = 'erro: ' + e.message;
        log('Falha ao carregar pendentes: ' + e.message, false);
      }
    }

    async function selectMovimento(id) {
      try {
        selectedMovimento = await apiGet(`/api/movimentos/${id}`);
        await loadItensEPosicoes();
        renderHeader();
        renderItens();
      } catch (e) {
        log('Falha ao selecionar movimento: ' + e.message, false);
      }
    }

    async function loadItensEPosicoes() {
      const [itens, posicoes, ocupacoes] = await Promise.all([
        apiGet('/api/movimento_items'), apiGet('/api/movimento_item_posicaos'), apiGet('/api/local_armazenagem_lotes')
      ]).then(r => r.map(list));
      cache.itens = itens.filter(i => i.movimentoId === selectedMovimento.id);
      cache.posicoes = posicoes;
      cache.ocupacoes = ocupacoes;
    }

    function posicoesDoItem(itemId, papel) {
      return cache.posicoes.filter(p => p.movimentoItemId === itemId && p.papel === papel);
    }

    // Same ledger-sync helper as centro-trabalho.html: Origem decrements, Destino increments.
    async function syncOcupacao(localArmazenagemId, loteId, quantidadeDelta) {
      const existente = cache.ocupacoes.find(o => o.localArmazenagemId === localArmazenagemId && o.loteId === loteId);
      if (existente) {
        const nova = Math.max(0, Number(existente.quantidade) + quantidadeDelta);
        await apiSend('PUT', `/api/local_armazenagem_lotes/${existente.id}`, { ...existente, quantidade: nova });
      } else if (quantidadeDelta > 0) {
        await apiSend('POST', '/api/local_armazenagem_lotes', {
          localArmazenagemId, loteId, quantidade: quantidadeDelta
        });
      }
    }

    async function criarMovimento() {
      const entidadeId = $('entidadeSel').value;
      if (!entidadeId) { log('Selecione uma Entidade.', false); return; }
      const mov = await apiSend('POST', '/api/movimentos', {
        entidadeId, tipo: 'MovtoLivre', situacao: 'Pendente', dataMovimento: new Date().toISOString().slice(0, 10)
      });
      log(`Movimento Livre ${short(mov.id)} criado.`, true);
      await loadPendentes();
    }

    // ---- Header ----
    function renderHeader() {
      const section = $('headerSection');
      section.innerHTML = '';
      if (!selectedMovimento) {
        section.innerHTML = '<div class="hint">Nenhum Movimento Livre pendente selecionado. Crie um novo acima.</div>';
        return;
      }
      const h = document.createElement('h2');
      h.textContent = `Movimento Livre ${short(selectedMovimento.id)}`;
      section.appendChild(h);

      const info = document.createElement('div');
      info.className = 'row';
      info.innerHTML = `
        <span>Situacao: <span class="badge ${selectedMovimento.situacao}">${selectedMovimento.situacao}</span></span>
        <span>Data: ${selectedMovimento.dataMovimento}</span>
      `;
      section.appendChild(info);

      const actions = document.createElement('div');
      actions.className = 'row';
      const btn = document.createElement('button');
      btn.className = 'action'; btn.textContent = 'Confirmar Movimentacao';
      btn.onclick = async () => {
        try { await confirmarMovimentacao(); } catch (e) { log('Confirmar Movimentacao falhou: ' + e.message, false); }
      };
      actions.appendChild(btn);
      section.appendChild(actions);
    }

    async function confirmarMovimentacao() {
      if (!selectedMovimento) { log('Nenhum movimento selecionado.', false); return; }
      const naoBalanceado = cache.itens.some(item => {
        const origem = posicoesDoItem(item.id, 'Origem').reduce((s, p) => s + Number(p.quantidade || 0), 0);
        const destino = posicoesDoItem(item.id, 'Destino').reduce((s, p) => s + Number(p.quantidade || 0), 0);
        return origem !== Number(item.quantidade) || destino !== Number(item.quantidade);
      });
      if (cache.itens.length === 0 || naoBalanceado) {
        log('Todos os itens precisam ter Origem e Destino totalmente alocados (= quantidade do item) antes de confirmar.', false);
        return;
      }
      const result = await apiSend('POST', '/api/flows/ConfirmarMovimentacao/execute', { ...selectedMovimento, situacao: 'Concluido' });
      if (result.status !== 'OK') throw new Error(result.error || 'Falha ao confirmar movimentacao');
      log('Movimentacao livre confirmada.', true);
      await loadPendentes();
    }

    // ---- MovimentoItem lines ----
    function renderItens() {
      const section = $('itensSection');
      section.innerHTML = '';
      if (!selectedMovimento) {
        section.innerHTML = '<div class="hint">Crie ou selecione um Movimento Livre para adicionar itens.</div>';
        return;
      }
      const h = document.createElement('h2');
      h.textContent = 'Itens (produto/lote) -- Origem e Destino no mesmo item';
      section.appendChild(h);

      section.appendChild(renderAddItemForm());

      cache.itens.forEach(item => section.appendChild(renderItemBlock(item)));

      if (cache.itens.length === 0) {
        const hint = document.createElement('div');
        hint.className = 'hint';
        hint.textContent = 'Nenhum item ainda. Adicione um produto/lote acima.';
        section.appendChild(hint);
      }
    }

    function renderAddItemForm() {
      const row = document.createElement('div');
      row.className = 'row';
      const loteSel = document.createElement('select');
      cache.lotes.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.id; opt.textContent = loteLabel(l.id);
        loteSel.appendChild(opt);
      });
      const qty = document.createElement('input');
      qty.type = 'number'; qty.min = '1'; qty.value = '1'; qty.className = 'qty-input';
      const btn = document.createElement('button');
      btn.className = 'action'; btn.textContent = 'Adicionar Item';
      btn.onclick = async () => {
        try {
          const lote = cache.lotes.find(l => l.id === loteSel.value);
          await apiSend('POST', '/api/movimento_items', {
            movimentoId: selectedMovimento.id, produtoId: lote.produtoId, loteId: lote.id,
            quantidade: Number(qty.value || 1)
          });
          log('Item adicionado.', true);
          await loadItensEPosicoes();
          renderItens();
        } catch (e) { log('Falha ao adicionar item: ' + e.message, false); }
      };
      row.append(labelWrap('Lote/Produto', loteSel), labelWrap('Quantidade', qty), btn);
      return row;
    }

    function labelWrap(text, el) {
      const label = document.createElement('label');
      const span = document.createElement('span'); span.textContent = text;
      label.append(span, el);
      return label;
    }

    function renderItemBlock(item) {
      const block = document.createElement('div');
      block.className = 'item-block';

      const origemPosicoes = posicoesDoItem(item.id, 'Origem');
      const destinoPosicoes = posicoesDoItem(item.id, 'Destino');
      const totalOrigem = origemPosicoes.reduce((sum, p) => sum + Number(p.quantidade || 0), 0);
      const totalDestino = destinoPosicoes.reduce((sum, p) => sum + Number(p.quantidade || 0), 0);
      const ok = totalOrigem === Number(item.quantidade) && totalDestino === Number(item.quantidade);

      const head = document.createElement('div');
      head.className = 'item-head';
      head.innerHTML = `
        <span><b>${produtoNome(item.produtoId)}</b> &middot; Lote: ${loteLabel(item.loteId)} &middot; Qtd: ${item.quantidade}</span>
        <span class="banner ${ok ? 'ok' : 'pending'}">${ok ? 'Balanceado (Origem = Destino = Qtd)!' : `Origem: ${totalOrigem}/${item.quantidade} &middot; Destino: ${totalDestino}/${item.quantidade}`}</span>
      `;
      block.appendChild(head);

      const sides = document.createElement('div');
      sides.className = 'sides';
      sides.appendChild(renderSide(item, 'Origem', origemPosicoes));
      sides.appendChild(renderSide(item, 'Destino', destinoPosicoes));
      block.appendChild(sides);
      return block;
    }

    function renderSide(item, papel, posicoes) {
      const side = document.createElement('div');
      side.className = 'side';
      const h3 = document.createElement('h3');
      h3.className = papel.toLowerCase();
      h3.textContent = papel;
      side.appendChild(h3);

      const table = document.createElement('table');
      table.innerHTML = '<thead><tr><th>Local</th><th>Quantidade</th><th></th></tr></thead>';
      const tbody = document.createElement('tbody');
      posicoes.forEach(p => tbody.appendChild(renderPosicaoRow(p)));
      table.appendChild(tbody);
      side.appendChild(table);

      side.appendChild(renderAddPosicaoRow(item, papel));
      return side;
    }

    function renderPosicaoRow(posicao) {
      const tr = document.createElement('tr');
      const localTd = document.createElement('td');
      localTd.textContent = localLabel(posicao.localArmazenagemId);
      const qtyTd = document.createElement('td');
      const qtyInput = document.createElement('input');
      qtyInput.type = 'number'; qtyInput.min = '1'; qtyInput.value = posicao.quantidade; qtyInput.className = 'qty-input';
      qtyTd.appendChild(qtyInput);
      const actionTd = document.createElement('td');
      const saveBtn = document.createElement('button');
      saveBtn.className = 'secondary small'; saveBtn.textContent = 'Salvar';
      saveBtn.onclick = async () => {
        try {
          const itemDaPosicao = cache.itens.find(i => i.id === posicao.movimentoItemId);
          const novaQtd = Number(qtyInput.value);
          const delta = novaQtd - Number(posicao.quantidade);
          await apiSend('PUT', `/api/movimento_item_posicaos/${posicao.id}`, { ...posicao, quantidade: novaQtd });
          const sinal = posicao.papel === 'Destino' ? 1 : -1;
          await syncOcupacao(posicao.localArmazenagemId, itemDaPosicao.loteId, sinal * delta);
          log('Posicao atualizada (estoque sincronizado).', true);
          await loadItensEPosicoes();
          renderItens();
        } catch (e) { log('Falha ao atualizar posicao: ' + e.message, false); }
      };
      actionTd.appendChild(saveBtn);
      tr.append(localTd, qtyTd, actionTd);
      return tr;
    }

    function renderAddPosicaoRow(item, papel) {
      const row = document.createElement('div');
      row.className = 'row';
      const localSel = document.createElement('select');
      cache.locais.filter(l => l.situacao === 'Disponivel' || l.situacao === 'Ocupado').forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.id; opt.textContent = localLabel(l.id);
        localSel.appendChild(opt);
      });
      const qty = document.createElement('input');
      qty.type = 'number'; qty.min = '1'; qty.value = '1'; qty.className = 'qty-input';
      const addBtn = document.createElement('button');
      addBtn.className = 'action small'; addBtn.textContent = 'Adicionar';
      addBtn.onclick = async () => {
        try {
          const quantidade = Number(qty.value || 1);
          await apiSend('POST', '/api/movimento_item_posicaos', {
            movimentoItemId: item.id, localArmazenagemId: localSel.value,
            papel, quantidade
          });
          const sinal = papel === 'Destino' ? 1 : -1;
          await syncOcupacao(localSel.value, item.loteId, sinal * quantidade);
          log(`Posicao de ${papel} adicionada (estoque sincronizado).`, true);
          await loadItensEPosicoes();
          renderItens();
        } catch (e) { log('Falha ao adicionar posicao: ' + e.message, false); }
      };
      const suggestBtn = document.createElement('button');
      suggestBtn.className = 'suggest'; suggestBtn.textContent = 'Sugerir';
      suggestBtn.title = 'Chama a capacidade de alocacao (Fase 3) para sugerir um local';
      suggestBtn.onclick = () => sugerir(item, papel, localSel, qty);

      row.append(labelWrap('Local', localSel), labelWrap('Quantidade', qty), addBtn, suggestBtn);
      return row;
    }

    async function sugerir(item, papel, localSel, qtyInput) {
      try {
        const flow = papel === 'Destino' ? 'SugerirDestino' : 'SugerirOrigem';
        let body;
        if (flow === 'SugerirDestino') {
          const candidatos = cache.locais.map(l => ({
            localArmazenagemId: l.id, ruaId: l.ruaId, prioridade: 1,
            loteOcupanteId: null
          }));
          body = { loteId: item.loteId, candidatos };
        } else {
          const candidatos = cache.ocupacoes
            .filter(o => o.loteId === item.loteId && Number(o.quantidade) > 0)
            .map(o => ({
              localArmazenagemId: o.localArmazenagemId, loteId: o.loteId,
              dataValidade: (cache.lotes.find(l => l.id === o.loteId) || {}).dataValidade,
              quantidadeDisponivel: o.quantidade, prioridade: 1
            }));
          body = { quantidadeNecessaria: item.quantidade, candidatos };
        }
        const result = await apiSend('POST', `/api/flows/${flow}/execute`, body);
        if (result.status !== 'OK') throw new Error(result.error || 'Sugestao falhou');
        if (flow === 'SugerirDestino' && result.output.localArmazenagemId) {
          localSel.value = result.output.localArmazenagemId;
          log('Sugestao: ' + result.output.motivo, true);
        } else if (flow === 'SugerirOrigem' && result.output.alocacoes && result.output.alocacoes.length) {
          const primeira = result.output.alocacoes[0];
          localSel.value = primeira.localArmazenagemId;
          qtyInput.value = primeira.quantidadeAlocada;
          log(`Sugestao FIFO: ${result.output.alocacoes.length} local(is), ${result.output.quantidadeAtendida} atendido(s).`, true);
        } else {
          log('Nenhuma sugestao retornada.', false);
        }
      } catch (e) {
        log('Falha ao sugerir: ' + e.message, false);
      }
    }

    $('reload').addEventListener('click', loadPendentes);
    $('novoMovimento').addEventListener('click', () => criarMovimento().catch(e => log('Falha ao criar movimento: ' + e.message, false)));
    $('movimentoSel').addEventListener('change', () => selectMovimento($('movimentoSel').value));
    window.addEventListener('DOMContentLoaded', loadPendentes);
  </script>
</body>
</html>
